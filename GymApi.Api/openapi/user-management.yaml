openapi: 3.0.3
info:
  title: GymApi – User Management
  description: Generic subdomain for authentication, registration, and user profiles.
  version: "1.0.0"

paths:
  /api/users/register:
    post:
      tags: [ Users ]
      operationId: registerUser
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '200':
          description: User registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/users/login:
    post:
      tags: [ Users ]
      operationId: login
      summary: Login a user (Mocked for development)
      description: |
        Simulates authentication by associating the session with an email.
        Sets the user context for subsequent requests.
        In production, the client will authenticate directly with Supabase.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '404':
          description: User not found
        '401':
          description: Unauthorized

  /api/users/me:
    get:
      tags: [ Users ]
      operationId: getCurrentUser
      summary: Get the current authenticated user profile
      responses:
        '200':
          description: Current user profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          description: Not authenticated

components:
  responses:
    BadRequest:
      description: Validation error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    RegisterRequest:
      type: object
      required: [ email, name ]
      properties:
        email:
          type: string
          format: email
        name:
          type: string

    LoginRequest:
      type: object
      required: [ email ]
      properties:
        email:
          type: string
          format: email

    UserResponse:
      type: object
      required: [ id, email, name ]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        name:
          type: string

    ErrorResponse:
      type: object
      required: [ error ]
      properties:
        error:
          type: string
