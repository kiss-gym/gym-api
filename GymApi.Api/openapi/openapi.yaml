openapi: 3.1.0
info:
  title: Kiss Gym API
  description: API for Kiss Gym - Session Tracking and User Management.
  version: v1
paths:
  /:
    get:
      tags:
        - GymApi
      responses:
        '200':
          description: OK
  /api/Info/version:
    get:
      tags:
        - GymApi
      responses:
        '200':
          description: OK
  /api/sessions:
    post:
      tags:
        - Sessions
      summary: 'Create a new training session, optionally inheriting exercises.'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSessionRequest'
          text/json:
            schema:
              $ref: '#/components/schemas/CreateSessionRequest'
          application/*+json:
            schema:
              $ref: '#/components/schemas/CreateSessionRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
    get:
      tags:
        - Sessions
      summary: 'Get sessions with optional filtering, sorting, and pagination.'
      parameters:
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/SessionStatus'
        - name: sort
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            format: int32
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            format: int32
            default: 10
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponsePagedResponse'
  '/api/sessions/{sessionId}':
    get:
      tags:
        - Sessions
      summary: Get a session by ID.
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
    patch:
      tags:
        - Sessions
      summary: Rename a session.
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RenameSessionRequest'
          text/json:
            schema:
              $ref: '#/components/schemas/RenameSessionRequest'
          application/*+json:
            schema:
              $ref: '#/components/schemas/RenameSessionRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
    delete:
      tags:
        - Sessions
      summary: Delete a session.
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: No Content
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  '/api/sessions/{sessionId}/finish':
    post:
      tags:
        - Sessions
      summary: Finish the session. Any running exercise is auto-finished first.
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /api/sessions/active:
    get:
      tags:
        - Sessions
      summary: Get active sessions with optional pagination.
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            format: int32
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            format: int32
            default: 10
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponsePagedResponse'
  '/api/sessions/{sessionId}/exercises':
    post:
      tags:
        - Sessions
      summary: Add a new exercise to the session.
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddExerciseRequest'
          text/json:
            schema:
              $ref: '#/components/schemas/AddExerciseRequest'
          application/*+json:
            schema:
              $ref: '#/components/schemas/AddExerciseRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExerciseResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  '/api/sessions/{sessionId}/exercises/{exerciseId}':
    patch:
      tags:
        - Sessions
      summary: Update an exercise.
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: exerciseId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateExerciseRequest'
          text/json:
            schema:
              $ref: '#/components/schemas/UpdateExerciseRequest'
          application/*+json:
            schema:
              $ref: '#/components/schemas/UpdateExerciseRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExerciseResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
    delete:
      tags:
        - Sessions
      summary: Remove an exercise from an active session.
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: exerciseId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: No Content
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  '/api/sessions/{sessionId}/exercises/{exerciseId}/start':
    post:
      tags:
        - Sessions
      summary: Start a pending exercise.
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: exerciseId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartExerciseRequest'
          text/json:
            schema:
              $ref: '#/components/schemas/StartExerciseRequest'
          application/*+json:
            schema:
              $ref: '#/components/schemas/StartExerciseRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExerciseResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  '/api/sessions/{sessionId}/exercises/{exerciseId}/finish':
    post:
      tags:
        - Sessions
      summary: Finish a running exercise.
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: exerciseId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExerciseResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  '/api/sessions/{sessionId}/exercises/{exerciseId}/sets':
    get:
      tags:
        - Sessions
      summary: Get all sets for an exercise.
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: exerciseId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ExerciseSetResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
    post:
      tags:
        - Sessions
      summary: Add a new set to an exercise.
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: exerciseId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddSetRequest'
          text/json:
            schema:
              $ref: '#/components/schemas/AddSetRequest'
          application/*+json:
            schema:
              $ref: '#/components/schemas/AddSetRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExerciseSetResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  '/api/sessions/{sessionId}/exercises/{exerciseId}/sets/copy-last':
    post:
      tags:
        - Sessions
      summary: Add a copy of the last set to an exercise.
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: exerciseId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExerciseSetResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  '/api/sessions/{sessionId}/exercises/{exerciseId}/sets/{setId}':
    patch:
      tags:
        - Sessions
      summary: Update weight and repetitions of a set.
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: exerciseId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: setId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSetRequest'
          text/json:
            schema:
              $ref: '#/components/schemas/UpdateSetRequest'
          application/*+json:
            schema:
              $ref: '#/components/schemas/UpdateSetRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExerciseSetResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
    delete:
      tags:
        - Sessions
      summary: Delete a set.
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: exerciseId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: setId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: No Content
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  '/api/sessions/{sessionId}/exercises/{exerciseId}/sets/{setId}/complete':
    post:
      tags:
        - Sessions
      summary: Mark a set as completed.
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: exerciseId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: setId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExerciseSetResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  '/api/sessions/{sessionId}/exercises/{exerciseId}/sets/{setId}/uncomplete':
    post:
      tags:
        - Sessions
      summary: Mark a set as not completed.
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: exerciseId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: setId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExerciseSetResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /api/users/me:
    get:
      tags:
        - Users
      summary: Get the current authenticated user profile.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
components:
  schemas:
    AddExerciseRequest:
      required:
        - autoLabel
      type: object
      properties:
        autoLabel:
          type: string
        photoUrl:
          type: string
          nullable: true
        properties:
          type: array
          items:
            $ref: '#/components/schemas/ExercisePropertyDto'
          nullable: true
      additionalProperties: false
    AddSetRequest:
      type: object
      properties:
        weight:
          type: number
          format: double
          nullable: true
        repetitions:
          type: integer
          format: int32
          nullable: true
      additionalProperties: false
    CreateSessionRequest:
      type: object
      properties:
        label:
          type: string
          nullable: true
        inheritFromSessionId:
          type: string
          format: uuid
          nullable: true
      additionalProperties: false
    ExercisePropertyDto:
      required:
        - name
        - value
      type: object
      properties:
        name:
          type: string
        value:
          type: string
      additionalProperties: false
    ExercisePropertyResponse:
      required:
        - name
        - value
      type: object
      properties:
        name:
          type: string
        value:
          type: string
      additionalProperties: false
    ExerciseResponse:
      required:
        - autoLabel
        - properties
        - sets
        - status
      type: object
      properties:
        id:
          type: string
          format: uuid
        autoLabel:
          type: string
        photoUrl:
          type: string
          nullable: true
        startedAt:
          type: string
          format: date-time
          nullable: true
        realEndAt:
          type: string
          format: date-time
          nullable: true
        status:
          type: string
        properties:
          type: array
          items:
            $ref: '#/components/schemas/ExercisePropertyResponse'
        sets:
          type: array
          items:
            $ref: '#/components/schemas/ExerciseSetResponse'
      additionalProperties: false
    ExerciseSetResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        setNumber:
          type: integer
          format: int32
        isCompleted:
          type: boolean
        weight:
          type: number
          format: double
          nullable: true
        repetitions:
          type: integer
          format: int32
          nullable: true
      additionalProperties: false
    ProblemDetails:
      type: object
      properties:
        type:
          type: string
          nullable: true
        title:
          type: string
          nullable: true
        status:
          type: integer
          format: int32
          nullable: true
        detail:
          type: string
          nullable: true
        instance:
          type: string
          nullable: true
      additionalProperties: { }
    RenameSessionRequest:
      required:
        - label
      type: object
      properties:
        label:
          type: string
      additionalProperties: false
    SessionResponse:
      required:
        - exercises
        - status
      type: object
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        finishedAt:
          type: string
          format: date-time
          nullable: true
        status:
          type: string
        label:
          type: string
          nullable: true
        inheritedFromSessionId:
          type: string
          format: uuid
          nullable: true
        exercises:
          type: array
          items:
            $ref: '#/components/schemas/ExerciseResponse'
      additionalProperties: false
    SessionResponsePagedResponse:
      required:
        - items
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/SessionResponse'
        page:
          type: integer
          format: int32
        pageSize:
          type: integer
          format: int32
        totalCount:
          type: integer
          format: int32
        totalPages:
          type: integer
          format: int32
          readOnly: true
      additionalProperties: false
    SessionStatus:
      enum:
        - Active
        - Finished
      type: string
    StartExerciseRequest:
      type: object
      additionalProperties: false
    UpdateExerciseRequest:
      type: object
      properties:
        autoLabel:
          type: string
          nullable: true
        photoUrl:
          type: string
          nullable: true
        properties:
          type: array
          items:
            $ref: '#/components/schemas/ExercisePropertyDto'
          nullable: true
      additionalProperties: false
    UpdateSetRequest:
      type: object
      properties:
        weight:
          type: number
          format: double
          nullable: true
        repetitions:
          type: integer
          format: int32
          nullable: true
      additionalProperties: false
    UserResponse:
      required:
        - email
        - name
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        name:
          type: string
      additionalProperties: false
tags:
  - name: GymApi
  - name: Sessions
  - name: Users
